                message: Stok tidak mencukupi
                data: {}
          headers: {}
        '410':
          description: 'Access Token melewati TTL pilih tiket, queue token sudah dicabut (user cancel), atau event sold out (TOKEN_EXPIRED / SOLD_OUT)'
          content:
