      summary: Register akun customer
      deprecated: false
      description: Daftar akun customer baru. Publik. (FR-A1)
      operationId: register
      tags:
      - Login Page
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
            example:
              email: user@example.com
              password: password123
              name: Surya
        required: true
      responses:
        '200':
          description: Akun berhasil dibuat
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/RegisterResponse"
              example:
                status: '00000'
                message: Akun dibuat
                data:
                  userId: '018f2c1a-0000-7000-8000-000000000001'
                  email: user@mail.com
                  role: customer
          headers: {}
        '400':
          "$ref": "#/components/responses/BadRequest"
          description: Request tidak valid
        '409':
          "$ref": "#/components/responses/Conflict"
          description: Konflik (mis. EMAIL_TAKEN)
      security: []
  "/auth/login":
    post:
      summary: Login customer/admin
      deprecated: false
      description: Login dan terbitkan JWT. Publik. (FR-A2, FR-A5)
      operationId: login
      tags:
      - Login Page
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
            example:
              email: user@example.com
              password: password123
        required: true
      responses:
        '200':
          description: Login sukses
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/LoginResponse"
              example:
                status: '00000'
                message: Login sukses
                data:
                  authToken: eyJhbGciOi...
                  refreshToken: eyJhbGciOi...
                  role: customer
                  expiresIn: 3600
          headers: {}
        '401':
          "$ref": "#/components/responses/Unauthorized"
          description: Token tidak ada / tidak sah
      security: []
  "/auth/logout":
    post:
      summary: Logout (cabut sesi login)
      deprecated: false
      description: |-
        Akhiri sesi login. Tanpa body: sesi diambil dari klaim `sid` di authToken (`Authorization: Bearer`).
        - Mencabut **authToken dan refreshToken** sesi itu (denylist Redis selama umur refreshToken). Sesi login lain milik user yang sama tidak terpengaruh.
        - Setelah logout, `refreshToken` sesi itu ditolak di `POST /auth/refresh` (401).
        - Idempoten untuk token lama tanpa `sid` (tidak ada yang dicabut, tetap 200). Token yang sudah dicabut/kedaluwarsa → 401.
        - Pencabutan ditegakkan oleh endpoint user-service. Service lain (event, booking, payment) hanya memverifikasi tanda tangan dan masa berlaku JWT. (FR-A8)
      operationId: logout
      tags:
      - Login Page
      parameters: []
      responses:
        '200':
          description: Logout sukses
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok:
                          type: boolean
                          example: true
              example:
                status: '00000'
                message: Logout sukses
                data:
                  ok: true
          headers: {}
        '401':
          "$ref": "#/components/responses/Unauthorized"
          description: Token tidak ada / tidak sah
      security:
      - userJWT: []
  "/auth/refresh":
    post:
      summary: Perbarui token (refresh)
      deprecated: false
      description: |-
        Tukar `refreshToken` dengan `authToken` + `refreshToken` baru dalam sesi login yang sama. Dipanggil FE saat `authToken` kedaluwarsa (401) atau menjelang kedaluwarsa (`expiresIn`).
        - **Tanpa header Authorization** — kredensialnya `refreshToken` di body.
        - `refreshToken` bersifat **sekali pakai**: setelah dipakai, token lama ditolak. FE wajib mengganti kedua token yang tersimpan.
        - `role` dibaca ulang dari database, sehingga perubahan role berlaku di token baru.
        - Ditolak 401 bila token rusak/kedaluwarsa, sudah dipakai, sesinya sudah logout, atau user sudah tidak ada (satu pesan yang sama untuk semua sebab).
        - Rate limit per IP (batas yang sama dengan login).
      operationId: refreshToken
      tags:
      - Login Page
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
            example:
              refreshToken: eyJhbGciOi...
        required: true
      responses:
        '200':
          description: Token diperbarui
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/LoginResponse"
              example:
                status: '00000'
                message: token diperbarui
                data:
                  authToken: eyJhbGciOi...
                  refreshToken: eyJhbGciOi...
                  role: customer
                  expiresIn: 3600
          headers: {}
        '400':
          description: Body rusak atau refreshToken kosong
        '401':
          "$ref": "#/components/responses/Unauthorized"
          description: Refresh token tidak valid
        '429':
          description: Terlalu banyak percobaan
      security: []
