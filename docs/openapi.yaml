  "/api/queue/v1/event/{eventId}/join":
    post:
      summary: Masuk antrian / minta akses
      deprecated: false
      description: 'Minta akses event. Jika booking room penuh → masuk antrian (QUEUED); jika ada slot → langsung ADMITTED + Access Token. userJWT **opsional** (guest boleh antre); `queueToken` ditautkan ke NIK begitu diketahui (1 NIK = 1 antrian/event). (FR-04, FR-05, FR-A3, Req 2, 22, 23)

'
      operationId: enqueue
      tags:
      - Waiting Room
      parameters:
      - name: eventId
        in: path
        description: ID event (UUID)
        required: true
        example: '018f2c1a-0000-7000-8000-0000000000a1'
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Masuk antrian atau langsung admitted
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/QueueEnqueueResponse"
              examples:
                admitted:
                  summary: Langsung dapat akses (ada slot booking room)
                  value:
                    status: '00000'
                    message: Admitted
                    data:
                      status: ADMITTED
                      queueToken: q_abc
                      accessToken: acc_xyz
                      bookingExpiresAt: '2026-11-01T10:05:00Z'
                queued:
                  summary: Masuk antrian
                  value:
                    status: '00000'
                    message: Queued
                    data:
                      status: QUEUED
                      queueToken: q_abc
                      position: 1423
                      etaSeconds: 420
          headers: {}
        '410':
          description: Event sold out, antrian ditutup (internal SOLD_OUT) (BR-10, FR-10b)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
              example:
                status: '410'
                message: Tiket sudah habis
                data: {}
          headers: {}
        '503':
          description: Antrian penuh (internal QUEUE_FULL) — ramai, coba lagi (Req 22, FR-10c)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
              example:
                status: '503'
                message: Antrian sedang penuh
                coba lagi sebentar: 
                data: {}
          headers: {}
      security: []
