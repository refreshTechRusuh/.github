  "/api/booking/v1/{bookingId}/cancel":
    post:
      summary: Cancel booking
      deprecated: false
      description: |-
        User keluar total dari booking room dan harus antri ulang.

        - `HELD` → `CANCELLED`, stok dikembalikan (atomik, `SELECT ... FOR UPDATE`).
        - Boleh walau Payment Page/Snap sudah dibuka: payment `PENDING` ikut di-`EXPIRED` dan transaksi Midtrans di-expire (best-effort).
        - Ditolak **409** bila sudah `PAID` (atau payment `SUCCESS`), **410** bila `EXPIRED`. Sudah `CANCELLED` → 200 tanpa efek (idempoten).
        - Queue token dicabut: `POST /api/booking/v1/create` dengan Access Token lama → 410.
        - `bookingId` di Payment Token harus sama dengan path, jika tidak 403.
      tags: []
      parameters:
      - name: bookingId
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Booking dibatalkan (atau sudah CANCELLED sebelumnya)
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        bookingId:
                          type: string
                        status:
                          type: string
                          example: CANCELLED
        '403':
          description: bookingId di Payment Token tidak sama dengan path
        '409':
          description: Booking sudah PAID (BOOKING_ALREADY_PAID)
        '410':
          description: Booking sudah EXPIRED
          headers: {}
      security:
      - paymentToken: []
