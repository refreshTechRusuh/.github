---
openapi: 3.0.1
info:
  title: Rusuh Booking Tiket — Backend API
  description: |
    Kontrak API backend untuk sistem booking tiket konser (flash crowd). Endpoint dikelompokkan **per halaman / journey** (tags) agar mudah dinavigasi saat diimpor ke Apidog/Postman: Login, Member/NIK, Home, Waiting Room, Detail Ticket, Payment, Admin, dan service internal (Dukcapil mock).

    ## Standar Response (envelope)
    Semua response (sukses & gagal) memakai **satu envelope** dari `pkg/apinizer`:
    ```
    { "status": "00000" | "<kode HTTP>", "message": "...", "data": { ... }, "partial": false }
    ```
    - Sukses: `status="00000"`, HTTP 200, `data` = payload.
    - Gagal: `status` = string kode HTTP ("400","401",...), `data = {}`,
      `message` generik. Kode error domain (`apperror.AppError.ErrorCode`)
      dipakai internal untuk memilih status + message; **tidak** jadi field body.

    - **Transaction ID** dibawa di **response header** (`X-Transaction-Id`), bukan body.

    Di spec ini envelope direpresentasikan eksplisit: tiap response `allOf` [`Envelope`] + `data` yang di-`$ref` ke payload spesifik (gaya A).

    ## Auth (login OPTIONAL — pola KAI)
    - `Authorization: Bearer <authToken>` — JWT login. **Opsional** untuk journey
      beli (guest boleh tanpa); **wajib** untuk member/NIK, riwayat, & admin.

    - `X-Access-Token: <accessToken>` — token antrian; wajib untuk Detail/Booking/Payment.
    - Guest: identitas pembeli = **data penonton (nik+nama+tglLahir+namaIbu, dicocokkan Dukcapil) + email** + Access Token.

    ## Realtime
    - **SSE** (Server-Sent Events) untuk **posisi antrian** dan **stok** (seragam,
      satu arah server→klien). Didokumentasikan sebagai handshake GET `text/event-stream`.

    Semua timestamp ISO-8601 UTC.

    ## Base URL
    - Production: `https://rusuh-gateway-stream-381331776726.asia-northeast1.gateway.dev` (wajib `https://`; tanpa skema → redirect 302 lalu klien mengirim ulang sebagai GET → 405).
    - Lokal: tiap service punya port sendiri (lihat `docs/LOCAL-SETUP.md`).
  version: 1.4.0
  contact:
    name: Tim Backend — Rusuh Booking Tiket
tags:
- name: Login Page
- name: Member/NIK
- name: Riwayat
- name: Home Page
