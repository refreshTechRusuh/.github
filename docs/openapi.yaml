          description: Token tidak ada / tidak sah
        '409':
          description: 'Stok tidak cukup (STOCK_UNAVAILABLE) atau NIK sudah memegang tiket untuk event ini (QUOTA_EXCEEDED; kuota 1 tiket per NIK per event)'
          content:
            application/json:
