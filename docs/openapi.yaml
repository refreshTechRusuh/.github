components:
  schemas:
    Envelope:
      type: object
      required:
      - status
      - message
      - data
      properties:
        status:
          type: string
          description: '"00000" = sukses; selain itu string kode HTTP'
          example: '00000'
        message:
          type: string
        data:
          description: Payload saat sukses; {} saat gagal
        partial:
          type: boolean
          description: true bila sebagian upstream gagal namun data tetap berguna
        meta:
          "$ref": "#/components/schemas/PageMeta"
          description: Info pagination pada endpoint list (opsional)
    PageMeta:
      type: object
      required:
      - page
      - size
      - totalItems
      - totalPages
      properties:
        page:
          type: integer
          description: Halaman saat ini (1-based)
          example: 1
        size:
          type: integer
          description: Jumlah item per halaman
          example: 10
        totalItems:
          type: integer
          description: Total seluruh item lintas halaman
          example: 42
        totalPages:
          type: integer
          description: Total halaman = ceil(totalItems/size)
          example: 5
    RegisterRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
    RegisterResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - customer
          - admin
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        authToken:
          type: string
          description: JWT login (bukan Access Token antrian). Membawa klaim `sid` (id sesi).
        refreshToken:
          type: string
          description: JWT berumur panjang (default 7 hari), sekali pakai di `POST /auth/refresh`.
        role:
          type: string
          enum:
          - customer
          - admin
        expiresIn:
          type: integer
          description: detik
    MeResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - customer
          - admin
    Member:
      type: object
      properties:
        memberId:
          type: string
        nik:
          type: string
          description: 16 digit
        nama:
          type: string
    MemberRequest:
      type: object
      required:
      - nik
      - nama
      - tglLahir
      - namaIbu
      properties:
        nik:
          type: string
          description: 16 digit
        nama:
          type: string
        tglLahir:
          type: string
          format: date
        namaIbu:
          type: string
          description: nama ibu kandung
    DukcapilVerifyRequest:
