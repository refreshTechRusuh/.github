  "/api/queue/v1/event/{eventId}/{queueToken}/stream":
    get:
      summary: Posisi antrian realtime (SSE)
      deprecated: false
      description: |
        **Server-Sent Events (text/event-stream).** Push posisi + ETA realtime. userJWT opsional. (FR-07, FR-08, FR-10a, Req 19)

        Event:
        ```
        event: position data: {"position": 310, "etaSeconds": 420}
        event: admitted data: {"accessToken":"acc_xyz","bookingExpiresAt":"2026-11-01T10:05:00Z"}
        event: sold_out data: {"message":"Tiket sudah habis. Antrian ditutup."}
        ```
      operationId: streamQueuePosition
      tags:
      - Waiting Room
      parameters:
      - name: eventId
        in: path
        description: ID event (UUID)
        required: true
        example: ''
        schema:
          type: string
          format: uuid
      - name: queueToken
        in: path
        description: Token antrian
        required: true
        example: ''
        schema:
          type: string
      responses:
        '200':
          description: Stream SSE (bukan envelope — text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                example: |+
                  event: position
                  data: {"position":310,"etaSeconds":420}

          headers: {}
      security: []
