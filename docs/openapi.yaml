        '200':
          description: Booking berhasil dibuat (HELD)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      bookingId:
                        type: string
                      status:
                        type: string
                      total:
                        type: integer
                      paymentToken:
                        type: string
                      paymentExpiresAt:
                        type: string
                    required:
                    - bookingId
                    - status
                    - total
                    - paymentToken
                    - paymentExpiresAt
                required:
                - status
                - message
                - data
              example:
                status: '00000'
                message: Booking dibuat
                data:
                  bookingId: '018f2c1a-0000-7000-8000-0000000000b1'
                  status: HELD
                  total: 3000000
                  paymentToken: eyJhbGciOi...
