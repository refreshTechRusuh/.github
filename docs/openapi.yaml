  responses:
    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Envelope"
          examples:
            Success:
              summary: Success
              value:
                status: '400'
                message: Request tidak valid
                data: {}
    Unauthorized:
      description: Token tidak ada / tidak sah
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Envelope"
          examples:
            Success:
              summary: Success
              value:
                status: '401'
                message: Token tidak valid
                data: {}
    Forbidden:
      description: Tidak punya hak akses (mis. butuh role admin)
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Envelope"
          examples:
            Success:
              summary: Success
              value:
                status: '403'
                message: Akses ditolak
                data: {}
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Envelope"
          examples:
            Success:
              summary: Success
              value:
                status: '404'
                message: Tidak ditemukan
                data: {}
    Conflict:
      description: Konflik (mis. EMAIL_TAKEN)
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Envelope"
          examples:
            Success:
              summary: Success
              value:
                status: '409'
                message: Email sudah terdaftar
                data: {}
  securitySchemes:
    userJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token login dari POST /auth/login (data.authToken). Opsional di journey beli; wajib untuk member, riwayat, admin.
    accessToken:
      type: apiKey
      in: header
      name: X-Access-Token
      description: Access Token antrian dari queue-service (saat status ADMITTED). Berlaku ~5 menit (TTL booking).
    paymentToken:
      type: apiKey
      in: header
      name: X-Payment-Token
      description: Payment Token dari POST /api/booking/v1/create (data.paymentToken). Berlaku sampai paymentExpiresAt (10 menit).
servers:
- url: https://rusuh-gateway-stream-381331776726.asia-northeast1.gateway.dev
  description: Production (API Gateway, streaming/SSE aktif). Wajib https://
- url: http://localhost:{port}
  description: Lokal (tiap service port sendiri, lihat LOCAL-SETUP.md)
  variables:
    port:
      default: '8081'
      enum:
      - '8081'
      - '8082'
      - '8083'
      - '8084'
      - '8085'
      - '8086'
      description: 8081 booking, 8082 event, 8083 payment, 8084 queue, 8085 dukcapil-mock, 8086 user
security: []
